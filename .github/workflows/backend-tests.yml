name: Backend Tests (golden)

# 后端 vitest 门禁：守黄金锚 ¥27,870（纯实验室收入拆分）/ ¥13,152（partner 收入）。
# 背景：此前全项目 CI 只有 e2e（Playwright），无任何 vitest 门禁；破坏黄金的 PR 在 GitHub 上不会变红。
# 见 docs/COREONE-工作模型调研-…-2026-07-01.md §〇.B。

on:
  push:
    branches: [master, main]
    # 纯文档/治理改动跳过**合并后**的重复 vitest（PR 时已跑过）。
    paths-ignore: ['**.md', 'docs/**', '.claude/**']
  # ⚠️ pull_request 故意**不加 paths-ignore**：本 workflow 稳定定义 `vitest` job，但它是否被当前 GitHub
  #    ruleset 设为 required、strict 或可 bypass 必须在每次合并前现场读取。保持 PR 侧一律上报同名 job，
  #    可避免平台将其设为 required 时，纯文档 PR 因整项跳过而卡在 "Expected/Waiting"。
  #    要让 PR 侧也对文档跳过，需另加同名 no-op 占位 workflow；这是独立机制决策，不由当前平台快照决定。
  pull_request:
    branches: [master, main, feat/phase2-lab-revenue-split]

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 后端代码/server
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Generate ephemeral CI JWT secret
        shell: bash
        run: |
          jwt_secret="$(openssl rand -base64 48)"
          echo "::add-mask::$jwt_secret"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          unset jwt_secret
      - name: Install
        run: npm ci
      - name: Run backend vitest (含 golden ¥27,870 / ¥13,152)
        # test:node = node --experimental-sqlite ... vitest run（node:sqlite 需该 flag）
        run: npm run test:node
